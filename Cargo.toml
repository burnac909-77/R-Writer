[package]
name = "r-writer-pure"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A pure Rust text editor built with Iced"

[dependencies]
iced = { version = "0.13", features = ["advanced", "tokio"] }
rfd = "0.15"

[package.metadata.deb]
maintainer = "Your Name <your.email@example.com>"
copyright = "2026, Your Name"
extended-description = """
A 100% pure Rust desktop text editor application built using the Iced framework.
"""
assets = [
    # 1. Copies the compiled binary into the system path
    ["target/release/r-writer-pure", "usr/bin/r-writer-pure", "755"],
    # 2. Registers the application menu shortcut
    ["r-writer-pure.desktop", "usr/share/applications/r-writer-pure.desktop", "644"],
    # 3. Installs your transparent logo icon for the app menu and window
    ["icon.png", "usr/share/pixmaps/r-writer-pure.png", "644"],
]
